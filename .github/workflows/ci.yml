name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      # We only bundle in CI (no GUI launch), so skip the Electron binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  golden:
    name: golden images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Electron needs its binary here (it renders the frames), plus xvfb for a display.
      - run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1
      - run: npm ci
      - run: npm run build
      - name: Render + compare golden images
        # --no-sandbox: the runners restrict unprivileged user namespaces, so the
        # Chromium SUID sandbox aborts; the content rendered is our own bundle.
        run: xvfb-run -a --server-args="-screen 0 1280x900x24" npx electron scripts/golden.cjs --check --no-sandbox
      - name: Upload rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-out
          path: golden-out/
