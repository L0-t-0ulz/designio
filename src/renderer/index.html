<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- NOTE: a strict Content-Security-Policy is intentionally omitted for now so the
         Vite dev server / HMR works out of the box. Hardening it is a later task. -->
    <title>DesignIO</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #16161c;
        color: #e7e7ee;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 16px;
        bottom: 14px;
        font-size: 12px;
        line-height: 1.5;
        color: #9aa0b5;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      #hud b {
        color: #d8d8e4;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <b>DesignIO</b> — drag to orbit · scroll to zoom · right-drag to pan
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
